<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Frontend Test App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow">Frontend test scaffold</p>
        <h1>Welcome to your test app</h1>
        <p class="description">
          This simple page is ready for layout, interaction, and styling checks.
        </p>

        <button id="demoButton">Click me</button>
        <p id="message" class="message">Ready for testing.</p>

        <form id="nameForm" class="form">
          <label for="nameInput">Enter a name</label>
          <input id="nameInput" name="name" type="text" placeholder="Your name" />
          <button type="submit">Say hello</button>
        </form>
        <p id="greeting" class="message"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
